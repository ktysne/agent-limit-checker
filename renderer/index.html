<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Agent Limit Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Agent Limit Checker</h1>
      <div class="header-buttons">
        <button id="refresh-btn" class="icon-btn" title="今すぐ更新">⟳</button>
      </div>
    </header>

    <section class="service" id="service-claude">
      <div class="service-head">
        <div class="service-title">
          <span class="brand-dot brand-claude"></span>
          <h2>Claude Code</h2>
        </div>
        <button class="icon-btn" data-login="claude" title="claude login を実行">🔑</button>
      </div>
      <div class="service-body" data-body="claude">
        <div class="loading">取得中…</div>
      </div>
    </section>

    <section class="service" id="service-codex">
      <div class="service-head">
        <div class="service-title">
          <span class="brand-dot brand-codex"></span>
          <h2>Codex</h2>
        </div>
        <button class="icon-btn" data-login="codex" title="codex login を実行">🔑</button>
      </div>
      <div class="service-body" data-body="codex">
        <div class="loading">取得中…</div>
      </div>
    </section>

    <section class="settings">
      <div class="setting-row">
        <label for="interval-select">更新間隔</label>
        <select id="interval-select">
          <option value="30">30秒</option>
          <option value="60">1分</option>
          <option value="120">2分</option>
          <option value="300" selected>5分</option>
          <option value="600">10分</option>
        </select>
      </div>
      <div class="setting-row">
        <label for="auto-launch">ログイン時に自動起動</label>
        <label class="switch">
          <input type="checkbox" id="auto-launch">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <footer class="footer">
      <span id="last-updated" class="muted"></span>
      <button id="quit-btn" class="text-btn">終了</button>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
