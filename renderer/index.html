<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Agent Limit Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Agent Limit Checker</h1>
      <div class="header-buttons">
        <button id="settings-toggle" class="icon-btn" title="設定" aria-controls="settings-panel" aria-expanded="false">⚙</button>
        <button id="refresh-btn" class="icon-btn" title="今すぐ更新">⟳</button>
      </div>
    </header>

    <section class="service" id="service-claude">
      <div class="service-head">
        <div class="service-title">
          <span class="brand-dot brand-claude"></span>
          <h2>Claude Code</h2>
        </div>
        <button class="icon-btn" data-login="claude" title="claude login を実行">🔑</button>
      </div>
      <div class="service-body" data-body="claude">
        <div class="loading">取得中…</div>
      </div>
    </section>

    <!-- One .service section per Codex account, built by renderCodexAccounts. -->
    <div id="codex-services"></div>

    <section id="settings-panel" class="settings" aria-labelledby="settings-title" hidden>
      <div class="settings-head">
        <h2 id="settings-title">設定</h2>
      </div>
      <div class="setting-row">
        <label for="interval-select">更新間隔</label>
        <select id="interval-select">
          <option value="30">30秒</option>
          <option value="60">1分</option>
          <option value="120">2分</option>
          <option value="300" selected>5分</option>
          <option value="600">10分</option>
        </select>
      </div>
      <div class="setting-row">
        <label for="auto-launch">ログイン時に自動起動</label>
        <label class="switch">
          <input type="checkbox" id="auto-launch">
          <span class="slider"></span>
        </label>
      </div>
      <!-- One rename input per discovered Codex account, built by
           renderCodexNameSettings. -->
      <div id="codex-name-group" class="settings-group" hidden>
        <fieldset>
          <legend>Codex 表示名</legend>
          <div id="codex-name-fields"></div>
          <div class="setting-hint">空にすると既定の名前に戻ります。</div>
        </fieldset>
      </div>
      <form id="ntfy-form" class="settings-group" action="#" method="post" autocomplete="off">
        <fieldset>
          <legend>ntfy 通知</legend>
          <label class="setting-field" for="ntfy-topic-url">
            <span>Topic URL</span>
            <input type="url" id="ntfy-topic-url" name="ntfy-topic-url" placeholder="https://ntfy.sh/your-topic" spellcheck="false" autocomplete="off">
          </label>
          <label class="setting-field" for="ntfy-access-token">
            <span>Access token (任意)</span>
            <input type="password" id="ntfy-access-token" name="ntfy-access-token" spellcheck="false" autocomplete="off">
          </label>
          <div class="setting-row">
            <label for="ntfy-notify-five-hour">5時間リセットを通知</label>
            <label class="switch">
              <input type="checkbox" id="ntfy-notify-five-hour" name="ntfy-notify-five-hour">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label for="ntfy-notify-weekly">週次リセットを通知</label>
            <label class="switch">
              <input type="checkbox" id="ntfy-notify-weekly" name="ntfy-notify-weekly">
              <span class="slider"></span>
            </label>
          </div>
          <div id="ntfy-status" class="setting-hint" aria-live="polite"></div>
        </fieldset>
      </form>
    </section>

    <footer class="footer">
      <span id="last-updated" class="muted"></span>
      <button id="quit-btn" class="text-btn">終了</button>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
